name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Every job below runs with NO Google Cloud credentials on purpose.
# The labs are contractually required to work offline; if one of them needs a
# project to pass, that is a bug in the lab, not in CI.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Offline test suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Repo contract and stale-fact guards
        run: python -m pytest tests/ -v

      - name: Lab test suite
        run: python -m pytest tracks/ -v

  labs:
    name: Every lab runs offline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run every lab end to end
        run: python cli.py --all

      - name: Run every cleanup script
        run: python cli.py --cleanup

  diagrams:
    name: Mermaid diagrams render
    runs-on: ubuntu-latest

    # tests/test_diagrams.py lints the common mistakes with no dependencies.
    # This job is the authoritative check: it runs the same parser GitHub uses,
    # so a diagram that would show "Unable to render rich display" fails here
    # first.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mermaid
        run: npm install --no-save mermaid jsdom

      - name: Parse every diagram
        run: node scripts/validate_mermaid.mjs
